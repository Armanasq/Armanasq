<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 292" role="img" aria-labelledby="t d"><title id="t">The evidence-to-systems loop</title><desc id="d">Five research engineering stages: Question, Evidence, System, Evaluation, and Release. No stage claims completion for any particular project.</desc><rect x="1" y="1" width="1128" height="290" rx="14" fill="#0c1520" stroke="#233747"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="41" fill="#e5edf0" font-size="19" font-weight="700">THE EVIDENCE-TO-SYSTEMS LOOP</text><text x="1100" y="39" text-anchor="end" fill="#9db0bb" font-size="12" letter-spacing="1">RESEARCH METHOD / 01</text><rect x="30" y="70" width="204" height="174" rx="12" fill="#10202a" stroke="#233747"/><text x="47" y="105" fill="#7ccfc3" font-size="13" font-family="monospace">01</text><text x="47" y="145" fill="#e5edf0" font-size="20" font-weight="700">QUESTION</text><path d="M47 159h168" stroke="#233747"/><text x="47" y="188" fill="#9db0bb" font-size="13">Define claims &amp; failure modes</text><text x="47" y="217" fill="#e0ab77" font-size="12">Hypotheses · discriminators</text><path d="M234 156h14m-5-5 5 5-5 5" stroke="#7ccfc3" stroke-width="1.6" fill="none"/><rect x="248" y="70" width="204" height="174" rx="12" fill="#12212d" stroke="#233747"/><text x="265" y="105" fill="#7ccfc3" font-size="13" font-family="monospace">02</text><text x="265" y="145" fill="#e5edf0" font-size="20" font-weight="700">EVIDENCE</text><path d="M265 159h168" stroke="#233747"/><text x="265" y="188" fill="#9db0bb" font-size="13">Acquire source-grounded data</text><text x="265" y="217" fill="#e0ab77" font-size="12">Provenance · uncertainty</text><path d="M452 156h14m-5-5 5 5-5 5" stroke="#7ccfc3" stroke-width="1.6" fill="none"/><rect x="466" y="70" width="204" height="174" rx="12" fill="#10202a" stroke="#233747"/><text x="483" y="105" fill="#7ccfc3" font-size="13" font-family="monospace">03</text><text x="483" y="145" fill="#e5edf0" font-size="20" font-weight="700">SYSTEM</text><path d="M483 159h168" stroke="#233747"/><text x="483" y="188" fill="#9db0bb" font-size="13">Implement minimal testable loops</text><text x="483" y="217" fill="#e0ab77" font-size="12">Retrieval · models · tools</text><path d="M670 156h14m-5-5 5 5-5 5" stroke="#7ccfc3" stroke-width="1.6" fill="none"/><rect x="684" y="70" width="204" height="174" rx="12" fill="#12212d" stroke="#233747"/><text x="701" y="105" fill="#7ccfc3" font-size="13" font-family="monospace">04</text><text x="701" y="145" fill="#e5edf0" font-size="20" font-weight="700">EVALUATION</text><path d="M701 159h168" stroke="#233747"/><text x="701" y="188" fill="#9db0bb" font-size="13">Challenge claims with baselines</text><text x="701" y="217" fill="#e0ab77" font-size="12">Ablations · latency · safety</text><path d="M888 156h14m-5-5 5 5-5 5" stroke="#7ccfc3" stroke-width="1.6" fill="none"/><rect x="902" y="70" width="204" height="174" rx="12" fill="#10202a" stroke="#233747"/><text x="919" y="105" fill="#7ccfc3" font-size="13" font-family="monospace">05</text><text x="919" y="145" fill="#e5edf0" font-size="20" font-weight="700">RELEASE</text><path d="M919 159h168" stroke="#233747"/><text x="919" y="188" fill="#9db0bb" font-size="13">Ship reproducible artifacts</text><text x="919" y="217" fill="#e0ab77" font-size="12">Traceability · monitoring</text><text x="30" y="275" fill="#9db0bb" font-size="12">An operating framework, not a claim of completed verification.</text></g></svg>