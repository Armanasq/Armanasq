<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 353" role="img" aria-labelledby="t d"><title id="t">DATA LINEAGE</title><desc id="d">No metrics without a source, denominator, and timestamp; Proof-carrying visual design: the underlying source and scope remain explicit.</desc><rect x="1" y="1" width="1098" height="351" rx="13" fill="#0c1520" stroke="#253846"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38" fill="#eef5f5" font-size="22" font-weight="700">DATA LINEAGE</text><text x="24" y="62" fill="#9fb3bb" font-size="13">No metrics without a source, denominator, and timestamp</text><rect x="24" y="83" width="1052" height="45" rx="5" fill="#11212b"/><text x="42" y="111" fill="#eef5f5" font-family="Arial,sans-serif" font-size="17" font-weight="600">Source</text><text x="1056" y="111" text-anchor="end" fill="#7dd7c7" font-family="Arial,sans-serif" font-size="16">GitHub public repository metadata</text><rect x="24" y="135" width="1052" height="45" rx="5" fill="#0f1c28"/><text x="42" y="163" fill="#eef5f5" font-family="Arial,sans-serif" font-size="17" font-weight="600">Boundary</text><text x="1056" y="163" text-anchor="end" fill="#9fb3bb" font-family="Arial,sans-serif" font-size="16">Public repositories only</text><rect x="24" y="187" width="1052" height="45" rx="5" fill="#11212b"/><text x="42" y="215" fill="#eef5f5" font-family="Arial,sans-serif" font-size="17" font-weight="600">Aggregation</text><text x="1056" y="215" text-anchor="end" fill="#9fb3bb" font-family="Arial,sans-serif" font-size="16">No private commit or star estimates</text><rect x="24" y="239" width="1052" height="45" rx="5" fill="#0f1c28"/><text x="42" y="267" fill="#eef5f5" font-family="Arial,sans-serif" font-size="17" font-weight="600">Refresh</text><text x="1056" y="267" text-anchor="end" fill="#9fb3bb" font-family="Arial,sans-serif" font-size="16">Initial snapshot; scheduled automation configured separately</text><text x="24" y="333" fill="#9fb3bb" font-size="12">Proof-carrying visual design: the underlying source and scope remain explicit.</text></g></svg>