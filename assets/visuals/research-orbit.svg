<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="title description"><title id="title">Research orbit</title><desc id="description">A three-dimensional-looking orbital network illustrating four research directions. Not a quantitative relationship.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151b32"/><stop offset=".52" stop-color="#0b1121"/><stop offset="1" stop-color="#0b0f19"/></linearGradient><radialGradient id="glow"><stop stop-color="#9479fc" stop-opacity=".19"/><stop offset="1" stop-color="#9479fc" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="615" rx="20" fill="url(#sky)"/><rect x="1" y="1" width="1198" height="613" rx="20" fill="none" stroke="#29374b"/><text x="38" y="47" text-anchor="start" fill="#b6a0ff" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2.4">RESEARCH SYSTEMS / CONNECTED DISCIPLINES</text><text x="38" y="86" text-anchor="start" fill="#f4f5fb" font-size="36" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">One research programme. Four frontiers.</text><text x="38" y="114" text-anchor="start" fill="#bbc4d6" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0">The questions that connect agentic intelligence, perception, and evidence.</text><ellipse cx="602" cy="317" rx="515" ry="149" fill="none" stroke="#34435a" stroke-width="1.5" transform="rotate(-10 602 317)"/><ellipse cx="602" cy="317" rx="342" ry="92" fill="none" stroke="#576180" stroke-width="1.2" stroke-dasharray="4 9" transform="rotate(18 602 317)"/><circle cx="602" cy="317" r="166" fill="url(#glow)"/><circle cx="602" cy="317" r="101" fill="#141d31" stroke="#968ac8" stroke-width="2"/><ellipse cx="602" cy="317" rx="139" ry="48" fill="none" stroke="#b9a3f6" stroke-opacity=".6" stroke-width="2" transform="rotate(-29 602 317)"/><circle cx="602" cy="317" r="76" fill="#101828" stroke="#4c5e77"/><line x1="241" y1="287" x2="602" y2="317" stroke="#b6a0ff" stroke-width="1.3" stroke-opacity="0.44"/><line x1="884" y1="246" x2="602" y2="317" stroke="#75caed" stroke-width="1.3" stroke-opacity="0.44"/><line x1="887" y1="394" x2="602" y2="317" stroke="#78e0b5" stroke-width="1.3" stroke-opacity="0.44"/><line x1="309" y1="417" x2="602" y2="317" stroke="#e7ba83" stroke-width="1.3" stroke-opacity="0.44"/><text x="602" y="305" text-anchor="middle" fill="#f4f5fb" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">RESEARCH</text><text x="602" y="332" text-anchor="middle" fill="#f4f5fb" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">CORE</text><text x="602" y="360" text-anchor="middle" fill="#bbc4d6" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0">PROVENANCE · EVALUATION</text><circle cx="241" cy="287" r="43" fill="#b6a0ff" fill-opacity=".06" stroke="#b6a0ff" stroke-width="1.4"/><ellipse cx="241" cy="287" rx="56" ry="19" fill="none" stroke="#b6a0ff" stroke-opacity=".6" stroke-width="1.2" transform="rotate(-27 241 287)"/><circle cx="241" cy="287" r="6" fill="#b6a0ff"/><text x="241" y="225" text-anchor="middle" fill="#f4f5fb" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">APEX-G</text><text x="241" y="244" text-anchor="middle" fill="#bbc4d6" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0.5">GENERALIZATION / ADAPTIVE AGENTS</text><circle cx="884" cy="246" r="43" fill="#75caed" fill-opacity=".06" stroke="#75caed" stroke-width="1.4"/><ellipse cx="884" cy="246" rx="56" ry="19" fill="none" stroke="#75caed" stroke-opacity=".6" stroke-width="1.2" transform="rotate(-27 884 246)"/><circle cx="884" cy="246" r="6" fill="#75caed"/><text x="884" y="184" text-anchor="middle" fill="#f4f5fb" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">ROBOTICS</text><text x="884" y="203" text-anchor="middle" fill="#bbc4d6" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0.5">SLAM / NAVIGATION</text><circle cx="887" cy="394" r="43" fill="#78e0b5" fill-opacity=".06" stroke="#78e0b5" stroke-width="1.4"/><ellipse cx="887" cy="394" rx="56" ry="19" fill="none" stroke="#78e0b5" stroke-opacity=".6" stroke-width="1.2" transform="rotate(-27 887 394)"/><circle cx="887" cy="394" r="6" fill="#78e0b5"/><text x="887" y="474" text-anchor="middle" fill="#f4f5fb" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">CLINICAL AI</text><text x="887" y="493" text-anchor="middle" fill="#bbc4d6" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0.5">EVIDENCE / DECISION SYSTEMS</text><circle cx="309" cy="417" r="43" fill="#e7ba83" fill-opacity=".06" stroke="#e7ba83" stroke-width="1.4"/><ellipse cx="309" cy="417" rx="56" ry="19" fill="none" stroke="#e7ba83" stroke-opacity=".6" stroke-width="1.2" transform="rotate(-27 309 417)"/><circle cx="309" cy="417" r="6" fill="#e7ba83"/><text x="309" y="497" text-anchor="middle" fill="#f4f5fb" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0">STATE ESTIMATION</text><text x="309" y="516" text-anchor="middle" fill="#bbc4d6" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0.5">IMU / PHYSICS / PINN</text><circle cx="162" cy="161" r="1.8" fill="#b6a0ff" opacity=".46"/><circle cx="361" cy="209" r="1.1" fill="#b6a0ff" opacity=".46"/><circle cx="994" cy="148" r="1.5" fill="#b6a0ff" opacity=".46"/><circle cx="1069" cy="385" r="1.7" fill="#b6a0ff" opacity=".46"/><circle cx="147" cy="501" r="1.2" fill="#b6a0ff" opacity=".46"/><circle cx="778" cy="513" r="1.5" fill="#b6a0ff" opacity=".46"/><circle cx="612" cy="150" r="1.8" fill="#b6a0ff" opacity=".46"/><text x="38" y="581" text-anchor="start" fill="#7d8ca6" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="600" letter-spacing="1.7">EDITORIAL TOPOLOGY  ·  NOT A SIMILARITY METRIC</text></svg>
