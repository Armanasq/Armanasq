<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc"><title id="title">Engineering technology stack</title><desc id="desc">Four raised three-dimensional panels grouping technologies used in AI reasoning, evidence retrieval, robotics, and infrastructure.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b34"/><stop offset="1" stop-color="#090e1c"/></linearGradient><linearGradient id="face" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1c2944"/><stop offset="1" stop-color="#10182a"/></linearGradient></defs><rect width="1200" height="575" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="573" rx="20" fill="none" stroke="#3b405f"/><text x="39" y="49" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c5b3ff">ENGINEERING STACK  /  FOUR INTERLOCKING LAYERS</text><text x="39" y="94" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#f0f0fa">From models to deployed systems</text><text x="40" y="126" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aebbd1">Technologies used across research, reasoning, perception, and production.</text><polygon points="84,160 574,160 554,174 64,174" fill="#a895f5" opacity=".75"/><polygon points="554,174 574,160 574,290 554,304" fill="#a895f5" opacity=".28"/><rect x="64" y="174" width="490" height="130" rx="7" fill="url(#face)" stroke="#3c4b68"/><rect x="64" y="174" width="5" height="130" rx="2" fill="#a895f5"/><text x="87" y="204" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#a895f5">01  /  AI / REASONING</text><text x="87" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f4f3fc">PyTorch · Transformers · Agentic AI</text><text x="87" y="272" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aebbd1">Python · structured state · inference</text><polygon points="664,160 1154,160 1134,174 644,174" fill="#6ed2d5" opacity=".75"/><polygon points="1134,174 1154,160 1154,290 1134,304" fill="#6ed2d5" opacity=".28"/><rect x="644" y="174" width="490" height="130" rx="7" fill="url(#face)" stroke="#3c4b68"/><rect x="644" y="174" width="5" height="130" rx="2" fill="#6ed2d5"/><text x="667" y="204" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#6ed2d5">02  /  RETRIEVAL / DATA</text><text x="667" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f4f3fc">SQL · FTS · evidence provenance</text><text x="667" y="272" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aebbd1">PostgreSQL · SQLite · RAG</text><polygon points="84,341 574,341 554,355 64,355" fill="#8ce0ad" opacity=".75"/><polygon points="554,355 574,341 574,471 554,485" fill="#8ce0ad" opacity=".28"/><rect x="64" y="355" width="490" height="130" rx="7" fill="url(#face)" stroke="#3c4b68"/><rect x="64" y="355" width="5" height="130" rx="2" fill="#8ce0ad"/><text x="87" y="385" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8ce0ad">03  /  ROBOTICS / ESTIMATION</text><text x="87" y="421" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f4f3fc">ROS · SLAM · navigation</text><text x="87" y="453" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aebbd1">IMU · quaternion estimation · VQF</text><polygon points="664,341 1154,341 1134,355 644,355" fill="#f2c58e" opacity=".75"/><polygon points="1134,355 1154,341 1154,471 1134,485" fill="#f2c58e" opacity=".28"/><rect x="644" y="355" width="490" height="130" rx="7" fill="url(#face)" stroke="#3c4b68"/><rect x="644" y="355" width="5" height="130" rx="2" fill="#f2c58e"/><text x="667" y="385" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#f2c58e">04  /  INFRASTRUCTURE</text><text x="667" y="421" font-family="Ari