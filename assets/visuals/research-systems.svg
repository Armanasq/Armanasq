<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" role="img" aria-labelledby="title desc"><title id="title">Research systems architecture</title><desc id="desc">Three research pillars converge on shared evaluation and production engineering.</desc><rect width="1260" height="520" rx="20" fill="#0c111c"/><g stroke="#223249" stroke-width="1"><path d="M35 70H1225M35 350H1225M35 462H1225"/></g><text x="55" y="49" fill="#f1f5fb" font-family="Arial" font-size="26" font-weight="700">RESEARCH SYSTEMS / AN INTEGRATED PRACTICE</text><text x="1205" y="49" fill="#92a3b9" font-family="Arial" font-size="14" text-anchor="end">RESEARCH DIRECTIONS · NOT PERFORMANCE CLAIMS</text><rect x="55" y="120" width="340" height="150" rx="10" fill="#151f30" stroke="#a4b7fa" stroke-opacity=".65"/><rect x="55" y="120" width="5" height="150" rx="2" fill="#a4b7fa"/><text x="77" y="149" fill="#a4b7fa" font-family="Arial" font-size="17" font-weight="700">01 / AGENTIC REASONING</text><text x="77" y="174" fill="#e2e9f4" font-family="Arial" font-size="15">Transfer · memory · metareasoning</text><text x="77" y="202" fill="#aab9cd" font-family="Arial" font-size="14">— Task generalization</text><text x="77" y="223" fill="#aab9cd" font-family="Arial" font-size="14">— Persistent knowledge</text><text x="77" y="244" fill="#aab9cd" font-family="Arial" font-size="14">— Evaluation under distribution shift</text><path d="M225 270 V320" stroke="#a4b7fa" stroke-width="2" stroke-dasharray="5 5"/><rect x="460" y="120" width="340" height="150" rx="10" fill="#151f30" stroke="#81d8c3" stroke-opacity=".65"/><rect x="460" y="120" width="5" height="150" rx="2" fill="#81d8c3"/><text x="482" y="149" fill="#81d8c3" font-family="Arial" font-size="17" font-weight="700">02 / PHYSICAL ESTIMATION</text><text x="482" y="174" fill="#e2e9f4" font-family="Arial" font-size="15">IMU · geometry · navigation</text><text x="482" y="202" fill="#aab9cd" font-family="Arial" font-size="14">— Quaternion and DCM constraints</text><text x="482" y="223" fill="#aab9cd" font-family="Arial" font-size="14">— Sensor fusion and reliability</text><text x="482" y="244" fill="#aab9cd" font-family="Arial" font-size="14">— Robustness across datasets</text><path d="M630 270 V320" stroke="#81d8c3" stroke-width="2" stroke-dasharray="5 5"/><rect x="865" y="120" width="340" height="150" rx="10" fill="#151f30" stroke="#f2c889" stroke-opacity=".65"/><rect x="865" y="120" width="5" height="150" rx="2" fill="#f2c889"/><text x="887" y="149" fill="#f2c889" font-family="Arial" font-size="17" font-weight="700">03 / EVIDENCE SYSTEMS</text><text x="887" y="174" fill="#e2e9f4" font-family="Arial" font-size="15">Retrieval · provenance · validation</text><text x="887" y="202" fill="#aab9cd" font-family="Arial" font-size="14">— Source-grounded decisions</text><text x="887" y="223" fill="#aab9cd" font-family="Arial" font-size="14">— Uncertainty and audit trails</text><text x="887" y="244" fill="#aab9cd" font-family="Arial" font-size="14">— Reproducible experiments</text><path d="M1035 270 V320" stroke="#f2c889" stroke-width="2" stroke-dasharray="5 5"/><rect x="55" y="320" width="1150" height="98" rx="10" fill="#19283a" stroke="#4b6683"/><text x="630" y="353" text-anchor="middle" fill="#eef4ff" font-family="Arial" font-size="20" font-weight="700">SHARED SCIENTIFIC CONTRACT</text><text x="630" y="380" text-anchor="middle" fill="#a9bdd0" font-family="Arial" font-size="16">Baselines · ablations · reproducibility · provenance · failure analysis · deployment constraints</text><text x="55" y="488" fill="#94a6bb" font-family="Arial" font-size="14">Explore the linked repositories for source code, experiments and their documented limitations.</text><text x="1205" y="488" fill="#94a6bb" font-family="Arial" font-size="14" text-anchor="end">DESIGNED FOR GITHUB README · SELF-HOSTED SVG</text></svg>
