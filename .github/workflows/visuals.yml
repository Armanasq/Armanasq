name: Visual research profile

on:
  workflow_dispatch:
  schedule:
    - cron: "18 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/visuals.yml"
      - "scripts/render_profile_art.py"
      - "tests/test_render_profile_art.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify renderer
        run: python -m unittest discover -s tests -v

      - name: Refresh original isometric visuals
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          python scripts/render_profile_art.py --user Armanasq --snapshot data/public-snapshot.json --contributions data/contributions.json --output assets/visuals

      - name: Validate SVG and contribution provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = list(Path("assets/visuals").glob("*.svg"))
          assert len(files) >= 4, "Profile visual assets are missing"
          for f in files:
              ET.parse(f)
              assert f.stat().st_size < 3000000, f
          data = json.loads(Path("data/contributions.json").read_text())
          assert data["status"] in {"verified", "unavailable"}
          if data["status"] == "verified":
              assert len({d["date"] for d in data["days"]}) >= 300
              assert data["source"]
          print("Validated",len(files),"SVGs; calendar:",data["status"])

      - name: Publish validated visual artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visuals/project-skyline.svg assets/visuals/contributions-3d.svg data/contributions.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh verified 3D research visuals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
