name: Research challenge responses
on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "51 6 * * *"
permissions:
  contents: write
  issues: read
concurrency:
  group: research-challenge-update
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render verified public responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research_challenge.py --output assets/interactive/research-challenge.svg
      - name: Commit tally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/interactive/research-challenge.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): update public research challenge [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
